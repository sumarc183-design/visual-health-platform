# Fichier de référence, lu par aucun script : il résume les réglages des runs
# publiés (README, « Résultats »). La source de vérité est run_baseline.py
# (valeurs par défaut) et la cellule 4 du notebook Colab.

data:
  image_size: 224            # résolution de préentraînement de RETFound
  preprocess: [none, crop-mask]   # comparés sur val ; voir src/data/fundus_preprocess.py
  rfmid:
    splits: officiels (train / val / test)
    classes: 28              # au moins 5 positifs dans le train (hors Disease_Risk)
  odir:
    classes: [N, D, G, C, A, H, M, O]
    labels: eye              # étiquette de l'œil photographié (patient = ~21 % d'images mal étiquetées)
    split: 70/15/15 par patient   # val = split d'origine 85/15 ; test tiré dans l'ancien train

retfound:
  checkpoint: third_party/retfound/checkpoints/RETFound_mae_natureCFP.pth
  architecture: ViT-L/16, global pool, figé
  embedding_dim: 1024

head:
  type: linéaire multi-label (BCE)
  optimizer: Adam
  lr: 1.0e-3
  epochs: 30
  batch_size: 16
  seed: 42

eval:
  metrics: [auroc_macro, auroc_per_class, f1_macro, gap_train_val]
  ci: bootstrap 1000 tirages sur les patients, IC 95 %
  comparison: différence appariée (scripts/compare_predictions.py), sur val

quality_control:
  blur_threshold: 1.0        # signale sans filtrer ; seuil à calibrer (classe déjà testée : 100)
