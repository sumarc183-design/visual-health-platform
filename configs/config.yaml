# Fichier de référence : aucun script ne le lit. Les runs réels (README,
# "Résultats") utilisent les arguments de run_baseline.py : images 224x224,
# tête linéaire lr 1e-3, 30 epochs, batch 16 -- pas les valeurs ci-dessous.

data:
  raw_dir: data/raw
  processed_dir: data/processed
  image_size: 512

retfound:
  repo: https://github.com/rmaphoh/RETFound_MAE
  checkpoint_path: third_party/retfound/checkpoints/RETFound_mae_natureCFP.pth
  embedding_dim: 1024   # ViT-Large

classifier:
  # RFMiD et ODIR ont des taxonomies différentes -- ne pas les traiter comme
  # une seule tête à num_classes générique. Sources : RIADD/RFMiD challenge
  # (45 pathologies annotées, sous-ensemble de 28 classes couramment utilisé
  # pour la classification -- hors "Disease_Risk" qui est un label binaire
  # séparé) ; ODIR-5K (8 classes, tutelle Shenzhen Zhongke, fortement
  # déséquilibré : Normal=2873 vs Hypertension=128).
  datasets:
    rfmid:
      num_classes: 28
      multilabel: true
      note: hors label binaire "Disease_Risk", évalué séparément si besoin
    odir:
      num_classes: 8
      multilabel: true
      class_names: [N, D, G, C, A, H, M, O]   # Normal/Diabetes/Glaucoma/Cataract/AMD/Hypertension/Myopie patho/Autre
      note: fortement déséquilibré (Normal 2873 vs Hypertension 128) -- utiliser class weights ou focal loss
      label_level: eye   # eye = étiquette de l'œil photographié (mots-clés) ; patient = diagnostic des deux yeux recopié (~21 % d'images mal étiquetées)
  lr: 1e-4
  epochs: 20
  batch_size: 32
  freeze_backbone: true    # phase 1 : sonde/fine-tuning léger uniquement

quality_control:
  blur_variance_threshold: 100.0   # variance du Laplacien, seuil à calibrer

eval:
  metrics: [auroc_macro, auroc_per_class, f1_macro]
