name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Formatage
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires (rapides)
        run: pytest tests/ -v -m "not slow"
      - name: Test bout-en-bout (données synthétiques)
        run: pytest tests/ -v -m "slow"
