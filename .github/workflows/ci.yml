name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Formatage
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]  # 3.10 = minimum annoncé dans pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      # Les tests écrivent des checkpoints ViT-L aléatoires (~1,2 Go chacun) :
      # dossier temporaire fixe, vidé après chaque exécution, sinon le disque
      # du runner (~14 Go) sature (« iostream error » dans torch.save).
      - name: Tests unitaires (rapides)
        run: |
          pytest tests/ -v -m "not slow" --basetemp="$RUNNER_TEMP/pytest"
          rm -rf "$RUNNER_TEMP/pytest"
          df -h . | tail -1
      - name: Test bout-en-bout (données synthétiques)
        # Un processus et un dossier temporaire par fichier (mémoire et disque).
        # En cas d'échec, les lignes FAILED/ERROR deviennent des annotations
        # (lisibles sur la page du run). Code 5 = aucun test sélectionné : normal.
        run: |
          for f in $(grep -l "pytest.mark.slow" tests/test_*.py); do
            set +e
            pytest "$f" -v -m "slow" -rfE --tb=short --basetemp="$RUNNER_TEMP/pytest" 2>&1 | tee slow.log
            status=${PIPESTATUS[0]}
            rm -rf "$RUNNER_TEMP/pytest"
            set -e
            if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
              grep -E "^(FAILED|ERROR)|^E  " slow.log | tail -15 | while IFS= read -r line; do echo "::error title=$f::$line"; done
              exit 1
            fi
          done

  test-windows:
    # Nouvel ordinateur de Marc : Windows 11, sans GPU NVIDIA. Tests rapides seulement.
    runs-on: windows-latest
    needs: lint
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires (rapides)
        # Échecs recopiés en annotations (lisibles sans compte sur la page du run).
        run: |
          set +e
          pytest tests/ -m "not slow" -rfE --tb=line -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" 2>&1 | tee win.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR) |^[A-Za-z]:.*: [A-Za-z]*(Error|Exception)" win.log | head -40 | while IFS= read -r line; do echo "::error title=windows::$line"; done
            exit 1
          fi
