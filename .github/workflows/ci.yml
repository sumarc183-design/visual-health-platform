name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer ruff
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Formatage
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]  # 3.10 = minimum annoncé dans pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Tests unitaires (rapides)
        run: pytest tests/ -v -m "not slow"
      - name: Test bout-en-bout (données synthétiques)
        # Un processus par fichier : chaque test charge un ViT-L (~1,2 Go) et la
        # mémoire du runner (~7 Go) saturait quand ils s'enchaînaient.
        run: |
          for f in $(grep -l "pytest.mark.slow" tests/test_*.py); do
            pytest "$f" -v -m "slow" || exit 1
          done
